# revloop — repository policy. Written by `revloop init`; yours to edit.
#
# This file is read from the BASE revision of every pull request, never from the
# branch under review, so a pull request cannot rewrite the loop that reviews it.
# A change here takes effect when it merges — the new policy is reviewed under the
# old one, which is the correct order.
#
# Machine-local endpoints belong in ~/.config/revloop/config.yml instead. A URL
# like http://tower.local:11434 asserts something false on a GitHub runner.
version: 1

mode: automated             # automated | local — who may write trusted state
runner: github-hosted       # github-hosted | self-hosted — where init renders the workflows to run

# Bounds on what revloop does unattended. The three continuation bounds end automatic reviewing and
# never block a person: a review a human asked for runs regardless. min_fix_severity is different —
# it bounds what an agent may change rather than whether the loop continues, so it holds on every
# run. Daily bounds roll over 24 hours rather than resetting at midnight.
policy:
  min_fix_severity: medium          # high | medium | low
  max_passes_per_cycle: 3
  max_files_changed_per_pr: 200
  max_prs_per_day: 25

# Declared and working, but NOT the CI reviewer: Kimi's subscription credential
# is a 15-minute OAuth access token with a rotating refresh token, not a static
# key, so it cannot live in a repository secret. Point a leg at it locally, or in
# CI once a static credential exists.
endpoints:
  kimi:
    base_url: https://api.kimi.com/coding/
    token_env: KIMI_API_KEY

# The pairing, as `revloop init` resolved it. init writes both blocks — harness,
# model, effort, and endpoint — so the committed file says
# what the loop runs and what init provisioned credentials for. A field resolving
# to nothing is removed rather than left at this template's value.
#
# Cross-vendor is strongest: a bug one model family misses reviewing, it misses
# resolving too. What works, and what each costs:
#
#   codex / claude   hosted, cross-vendor. Codex's token rotates, so it adds
#                    REVLOOP_CODEX_AUTH, a second App with Secrets: write, and a cron
#   claude / claude  one vendor, two models — fable reviewing, opus resolving. One
#                    secret, no cron. Weaker, and doubles Claude usage
#   agy / claude     cross-vendor, self-hosted only: agy's token lives about an hour
#   kimi / claude    local only. kimi is an endpoint on the claude adapter, and its
#                    credential is a 15-minute OAuth token
#
# Model ids must be fully qualified: `claude-fable-5`, never `fable-5`, which fails
# as an entitlement error rather than a typo. `effort` reaches the harness verbatim.
# Override a leg for one run with `--harness codex`, without touching this.
reviewer:
  harness: claude
  model: claude-fable-5
  effort: medium

resolver:
  harness: claude
  model: claude-opus-5
  effort: high

# Where a finding that is real but not fixed here goes. An unresolved thread on a
# merged pull request is visible in no GitHub view, so without a sink `deferred`
# findings leave their threads open instead of resolving into nothing.
sinks:
  issues:
    type: github_issue
    identity_label: revloop-review   # one flat label on every issue revloop files
    labels: [bug]                    # yours to override; your taxonomy wins
    create_labels: true              # false = use existing only, and fail loudly
    comment_on_match: false          # cross-link from the PR, not onto your issue

persist:
  defects: issues           # a sink name | none
  escalated: none           # a decision request, not a defect: a human is already coming

# Set to false to permanently silence the suggestion that a repository already
# running Actions could run this loop automatically. `--no-tips` does it per run.
enable_automation_hint: true
