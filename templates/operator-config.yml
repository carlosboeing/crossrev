# revloop — operator configuration.  Copy to ~/.config/revloop/config.yml
#
# This file never leaves your machine and is never committed. It holds the things
# that are true HERE and false everywhere else: an Ollama instance on your LAN, a
# router on localhost, a gateway on a home server. Committing those into a
# repository asserts something false for half the places the config is read.
#
# Endpoint definitions merge by name with the repository's, and this file wins. So
# a repo can declare a public endpoint while you point the same name at your own
# instance, with no change to the repo.
#
# Tokens are never in here. `token_env` names an environment variable; its value
# comes from your shell locally and from a repository secret in CI.
version: 1

endpoints:
  # Claude Code talks to anything exposing an Anthropic-compatible /v1/messages
  # endpoint, so the harness and the model are separate choices.

  # Moonshot's subscription endpoint. Verified: --json-schema survives it and
  # modelUsage comes back keyed by the answering model, so both the schema
  # contract and layer two of the divergence guard hold.
  kimi:
    base_url: https://api.kimi.com/coding/
    token_env: KIMI_API_KEY

  # Ollama has had native Anthropic compatibility since v0.14.0. The path to local
  # open-weight models. Note the variable name differs from Kimi's, which is why
  # the block names it rather than assuming one.
  #
  # Known hazard: Claude Code calls /v1/messages/count_tokens?beta=true, which has
  # been reported to hang Ollama's server.
  ollama:
    base_url: http://tower.local:11434
    token_env: OLLAMA_TOKEN        # Ollama requires a token and ignores it

  # OmniRoute stands up a local Anthropic-compatible endpoint fronting hundreds of
  # hosted models. Those are per-token billed — a billing fact to know, not a
  # config key.
  omniroute:
    base_url: http://localhost:8080
    token_env: OMNIROUTE_TOKEN

# An endpoint named by a leg and defined nowhere is a hard failure, never a
# fallback to the vendor's own API. Falling back would mean running Claude while
# the config says Ollama — the same silent substitution the divergence guard exists
# to catch, arriving through a different door.
