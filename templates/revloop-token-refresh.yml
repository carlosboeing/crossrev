# Generated by `revloop init` — regenerate with `revloop init --upgrade`.
#
# The single writer.
#
# Codex authenticates on a subscription with a rotating OAuth credential, and
# using a refresh token consumes it: the vendor hands back a replacement and
# invalidates what you presented. So every job refreshing for itself does not
# work — the first one to refresh kills every other copy. Exactly one job
# refreshes, on its own concurrency group, and the legs restore a copy and throw
# it away.
#
# This workflow is also the reason the second App exists. It is the only place
# revloop needs `Secrets: write`, and it is safe to have here for a reason that
# is visible in the file: it never checks out the pull request branch, never runs
# a model, never reads a diff or a comment. There is nothing in it to inject
# into. The same permission on the loop App would put secret rewriting one
# injection away from attacker-controlled text.
name: revloop token refresh

on:
  schedule:
    # Twice a day against a ten-day token — measured from a stored credential's
    # own iat and exp claims, not from documentation. That leaves about twenty
    # missed runs of headroom, which matters because GitHub's scheduler has a
    # five-minute floor and runs late under load. The offset minute keeps this
    # out of the top-of-hour crush that makes late runs later.
    - cron: "17 */12 * * *"
  workflow_dispatch:

# Never cancel, never overlap. Two concurrent refreshes are the exact failure
# this workflow exists to prevent.
#
# **This group is repository-scoped, and that is the boundary of the guarantee.**
# GitHub concurrency does not span repositories, so two repositories each running
# this workflow against the same seeded credential are two writers, and the first
# to refresh invalidates the other for good. That is why the credential is a
# repository secret rather than an organisation one, and why `revloop init` warns
# when it finds an organisation-level copy: one credential, one repository, one
# writer. A second repository needs its own `codex login` seed.
concurrency:
  group: revloop-token-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVLOOP_REFRESH_APP_ID }}
          private-key: ${{ secrets.REVLOOP_REFRESH_APP_PRIVATE_KEY }}

      # Only revloop's own source is checked out. The repository under review
      # never appears in this job, which is what keeps it free of anything a
      # pull request author can influence.
      - uses: actions/checkout@v5
        with:
          repository: __SOURCE_REPO__
          ref: __SOURCE_SHA__   # __SOURCE_REF__
          ssh-key: ${{ secrets.REVLOOP_SOURCE_KEY }}
          path: .revloop-src

      - run: echo "$GITHUB_WORKSPACE/.revloop-src/tools/revloop/bin" >>"$GITHUB_PATH"

      - name: refresh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REVLOOP_CODEX_AUTH: ${{ secrets.REVLOOP_CODEX_AUTH }}
        run: revloop auth refresh --harness codex __REFRESH_SCOPE__

      - if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method DELETE installation/token || true
