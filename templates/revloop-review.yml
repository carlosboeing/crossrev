# Generated by `revloop init` — regenerate with `revloop init --upgrade`.
#
# Hand-editing this file works until the next upgrade rewrites it. Change
# .github/revloop.yml instead; that is the file this one reads.
name: revloop review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
  issue_comment:
    types: [created]

# One concurrency group per pull request, SHARED with the resolve workflow. That
# sharing is what stops two legs writing the pull request at once.
#
# `queue: max` is not optional. GitHub's default keeps one running plus ONE
# pending run per group, and a newly queued run cancels the pending one and takes
# its place — so omitting the key silently drops events. `queue: max` holds up to
# 100 pending runs and executes them in order. Combining it with
# cancel-in-progress: true is a validation error, and this design wants neither:
# cancelling is unsafe once the resolve leg has started pushing.
#
# Run ordering is documented as FIFO but explicitly not guaranteed, so
# correctness comes from the head_sha check and the trusted markers. The queue
# only reduces wasted work.
concurrency:
  group: revloop-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  queue: max

jobs:
  review:
    # Fork pull requests are skipped rather than run unauthenticated: GitHub
    # withholds secrets from them. pull_request_target would supply the secrets
    # and is the one configuration that turns a fork PR into an exploit, so it
    # appears nowhere in this design.
    #
    # The fork check sits inside the pull_request branch rather than in front of
    # the whole condition. In front, it ANDed with the comment branch too — and
    # an issue_comment payload carries no github.event.pull_request at all, so
    # that read was null, the comparison was false, and the entire trigger could
    # never fire. The `on: issue_comment` block and the /revloop review branch
    # were dead the whole time.
    #
    # A comment cannot be fork-checked here, because its payload says nothing
    # about the head repository. That check moved into the first step below,
    # which runs before anything is checked out.
    if: >-
      (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.draft == false
        && (
          github.event.action != 'labeled'
          || github.event.label.name == 'revloop/awaiting-review'
        )
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '/revloop review')
        && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: __RUNS_ON__
    permissions:
      contents: read
    steps:
      # Every write goes through this token, never GITHUB_TOKEN. GitHub
      # deliberately does not fire workflows from events created with the default
      # token — it is the built-in loop guard, and it applies to label changes as
      # well as pushes. With the harness CLI called directly there is no managed
      # token to fall back on.
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Resolve the number, and make the fork check a comment cannot make in the
      # job condition above.
      #
      # This has to happen before the checkout below, not inside revloop, and the
      # difference matters. An issue_comment runs in the BASE repository's
      # context and therefore WITH secrets, while the next step checks out
      # refs/pull/N/head — attacker-controlled code on a fork pull request. A
      # guard that fired only once revloop was running would already have put
      # that code on disk beside a subscription token. That combination is
      # exactly what makes pull_request_target dangerous, and why it appears
      # nowhere in this design.
      - id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "number=$NUMBER" >>"$GITHUB_OUTPUT"
          fork="$(gh pr view "$NUMBER" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)"
          if [[ "$fork" == "true" ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::revloop does not run on fork pull requests: GitHub withholds secrets from them, and the head branch is not this repository's to push to. Review it by hand."
          fi

      - if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      # revloop itself lives in another account, and GitHub shares private
      # actions and reusable workflows only within one account — so `uses:`
      # cannot reach it and a checkout is the only mechanism available. It needs a
      # credential of its own: the App token is scoped to its own installation and
      # the default workflow token to the repository under review, so neither can
      # read a personal repository. REVLOOP_SOURCE_KEY is a read-only deploy key
      # on the source repo, and its blast radius if leaked is read access to that
      # one repository.
      #
      # A tag is not a pin: `git tag -f` plus a force push moves it. The 40
      # character SHA is the pin and the tag rides in the comment.
      - if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          repository: __SOURCE_REPO__
          ref: __SOURCE_SHA__   # __SOURCE_REF__
          ssh-key: ${{ secrets.REVLOOP_SOURCE_KEY }}
          path: .revloop-src

      # A hosted runner is a fresh container every time, so the harness is
      # installed per run. A self-hosted one already has them, along with the
      # logins they refresh on disk — which is the whole reason it needs no
      # token plumbing.
      - if: steps.pr.outputs.skip != 'true'
        run: |
          echo "$GITHUB_WORKSPACE/.revloop-src/tools/revloop/bin" >>"$GITHUB_PATH"
          # revloop:only github-hosted
          __HARNESS_INSTALL__
          # revloop:end

      - name: review
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REVLOOP_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          # revloop:only github-hosted
          # Restored, read and discarded. This job never writes either of them
          # back: the refresher workflow is the only writer, because using a
          # refresh token consumes it and a second writer kills the chain.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVLOOP_CODEX_AUTH: ${{ secrets.REVLOOP_CODEX_AUTH }}
          # revloop:end
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            revloop review --pr ${{ steps.pr.outputs.number }} --trigger automatic --no-tips
          else
            revloop review --pr ${{ steps.pr.outputs.number }} --no-tips
          fi

      # The token is revoked rather than left to expire, and this runs even when
      # the leg failed.
      - if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method DELETE installation/token || true
