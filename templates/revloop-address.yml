# Generated by `revloop init` — regenerate with `revloop init --upgrade`.
name: revloop address

on:
  pull_request:
    types: [labeled]

# The SAME group as the review workflow. Two legs must never write the pull
# request simultaneously, and one shared group is what prevents it. See the review
# workflow for why `queue: max` is required rather than optional.
concurrency:
  group: revloop-pr-${{ github.event.pull_request.number }}
  queue: max

jobs:
  address:
    if: >-
      github.event.label.name == 'revloop/awaiting-address'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: __RUNS_ON__
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The head branch by name, not by refs/pull/N/head: this leg pushes, and a
      # detached checkout of the merge ref has nothing to push to. revloop's own
      # push guard asserts the branch matches the pull request's head and is not
      # the repository default before anything leaves the runner.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/checkout@v5
        with:
          repository: __SOURCE_REPO__
          ref: __SOURCE_SHA__   # __SOURCE_REF__
          ssh-key: ${{ secrets.REVLOOP_SOURCE_KEY }}
          path: .revloop-src

      - run: |
          echo "$GITHUB_WORKSPACE/.revloop-src/tools/revloop/bin" >>"$GITHUB_PATH"
          # revloop:only github-hosted
          __HARNESS_INSTALL__
          # revloop:end

      - name: address
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REVLOOP_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          # revloop:only github-hosted
          # Read-only, and discarded when the leg finishes. See the review
          # workflow: one writer, and it is the refresher.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVLOOP_CODEX_AUTH: ${{ secrets.REVLOOP_CODEX_AUTH }}
          # revloop:end
        run: revloop address --pr ${{ github.event.pull_request.number }} --no-tips

      - if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method DELETE installation/token || true
