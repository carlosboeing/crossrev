# Generated by `crossrev init` — regenerate with `crossrev init --upgrade`.
#
# The watchdog exists because automated mode's failure mode is silence: a
# chaining bug looks identical to a converged pull request. Without this, a pass
# that never fired and a pass that converged are indistinguishable from outside.
name: crossrev watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: __RUNS_ON__
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: __SOURCE_REPO__
          ref: __SOURCE_SHA__   # __SOURCE_REF__
          ssh-key: ${{ secrets.CROSSREV_SOURCE_KEY }}
          path: .crossrev-src

      - run: echo "$GITHUB_WORKSPACE/.crossrev-src/tools/crossrev/bin" >>"$GITHUB_PATH"

      - name: watchdog
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CROSSREV_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: crossrev watchdog
