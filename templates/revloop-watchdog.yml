# Generated by `revloop init` — regenerate with `revloop init --upgrade`.
#
# The watchdog exists because event-driven mode's failure mode is silence: a
# chaining bug looks identical to a converged pull request. Without this, a pass
# that never fired and a pass that converged are indistinguishable from outside.
name: revloop watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: __SOURCE_REPO__
          ref: __SOURCE_SHA__   # __SOURCE_REF__
          ssh-key: ${{ secrets.REVLOOP_SOURCE_KEY }}
          path: .revloop-src

      - run: echo "$GITHUB_WORKSPACE/.revloop-src/tools/revloop/bin" >>"$GITHUB_PATH"

      - name: watchdog
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REVLOOP_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: revloop watchdog
