# The composite action consuming repositories call.
#
#   - uses: carlosboeing/crossrev@<40-char-sha>   # v0.1.0
#     with:
#       leg: review
#       pr: ${{ github.event.pull_request.number }}
#       app-token: ${{ steps.app.outputs.token }}
#
# The SHA is the pin and the tag is a comment: `git tag -f` plus a force push
# moves a tag, and the failure mode is a repository whose review behaviour
# changes with nothing in its own history to show for it. `crossrev init`
# generates the pinned form; the floating @v0 in the README is a human choosing
# convenience knowingly.
name: CrossRev
description: Review a pull request with one model and resolve the findings with another.
author: carlosboeing

inputs:
  leg:
    description: Which leg to run — review, resolve, cycle, status or watchdog.
    required: true
  pr:
    description: The pull request number. Not needed for watchdog.
    required: false
  app-token:
    description: >-
      A GitHub App installation token. Deliberately has NO default: GITHUB_TOKEN
      writes do not trigger workflows, so defaulting to it would stall the chain
      after pass 1 while looking healthy the whole way. Published review actions
      commonly default this input, and copying that here would be the exact bug
      the design exists to prevent.
    required: true
  harness:
    description: Override the harness the repository config names for that leg.
    required: false
  trigger:
    description: >-
      Whether a machine fired this or a person asked. `automatic` applies the
      policy caps — passes per cycle, pull requests per day, files changed — and
      skips draft pull requests. `human` applies none of them, which is correct
      for an explicit `/crossrev review` and wrong for anything on a timer.

      Defaults to `automatic` rather than mirroring the CLI's `human` default,
      because the two entry points fail safe in opposite directions: forgetting
      this input in a workflow should give you the caps, not an uncapped loop.
      Same reasoning as no-tips defaulting to true here and off in the CLI.
    required: false
    default: automatic
  no-tips:
    description: Suppress the automated-mode suggestion. Always true in CI.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The release ships a binary per runner, not a script the checkout runs, so
    # the action fetches the one for this machine before running anything. The
    # digest is checked against the checksums.txt from the same release before
    # the binary runs.
    #
    # The download comes before the preflight because the preflight runs from
    # the binary itself (the next step). The download needs only gh and a
    # checksum tool, and says so plainly when one of those is missing.
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.app-token }}
      run: |
        set -euo pipefail
        # Refused by name, before any download: the release builds Linux/X64
        # and macOS/ARM64 and nothing else.
        case "${RUNNER_OS:?}/${RUNNER_ARCH:?}" in
          Linux/X64)   asset="crossrev-linux-amd64" ;;
          macOS/ARM64) asset="crossrev-darwin-arm64" ;;
          *) echo "::error::CrossRev ships no binary for $RUNNER_OS/$RUNNER_ARCH (this release builds Linux/X64 and macOS/ARM64)."; exit 1 ;;
        esac

        # The pin is the SHA this action was loaded at, and releases are cut by
        # tag, so the SHA is resolved to the versioned tag pointing at it. A
        # tag ref is used as named.
        ref="${{ github.action_ref }}"
        if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
          tag="$(git ls-remote --tags https://github.com/carlosboeing/crossrev.git |
            awk -v sha="$ref" '
              /\^\{\}$/ { peeled[$2] = $1; next }
              { direct[$2] = $1 }
              END {
                for (r in peeled) {
                  t = r; sub(/\^\{\}$/, "", t); sub(/^refs\/tags\//, "", t)
                  if (peeled[r] == sha && t ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/) { print t; exit }
                }
                for (r in direct) {
                  t = r; sub(/^refs\/tags\//, "", t)
                  if (direct[r] == sha && t ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/) { print t; exit }
                }
              }')"
          [[ -n "$tag" ]] || {
            echo "::error::no CrossRev release tag points at $ref, so there is no release to download."
            exit 1
          }
        else
          tag="$ref"
        fi

        # A checksum tool under either name. macOS ships shasum and no
        # sha256sum; Linux ships sha256sum. Both check the same file format.
        if command -v sha256sum >/dev/null 2>&1; then
          sum="sha256sum"
        else
          sum="shasum -a 256"
        fi

        tmp="$RUNNER_TEMP/crossrev-dist"
        mkdir -p "$tmp"
        gh release download "$tag" --repo carlosboeing/crossrev \
          --pattern "$asset" --pattern checksums.txt --dir "$tmp" --clobber
        want="$(awk -v a="$asset" '$2 == a { print $1; found=1 } END { if (!found) exit 1 }' \
          "$tmp/checksums.txt")" || {
          echo "::error::checksums.txt from release $tag names no digest for $asset."
          exit 1
        }
        got="$($sum "$tmp/$asset")"; got="${got%% *}"
        [[ "$got" == "$want" ]] || {
          echo "::error::the downloaded $asset does not match its digest, so it was not run."
          exit 1
        }

        mkdir -p "$RUNNER_TEMP/crossrev-bin"
        install -m 755 "$tmp/$asset" "$RUNNER_TEMP/crossrev-bin/crossrev"
        echo "CROSSREV_BIN=$RUNNER_TEMP/crossrev-bin/crossrev" >> "$GITHUB_ENV"

    # The dependency preflight, from the downloaded binary. A consumer's
    # workflow cannot forget this, which is the only reason it lives here
    # rather than in each template. Installation stays the runner's job — this
    # fails naming the missing dependency rather than mid-leg with a
    # `command not found` three steps later.
    #
    # GH_TOKEN is set because doctor verifies gh is authenticated, not just
    # installed: an unauthenticated gh fails at the first API call instead.
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.app-token }}
      run: |
        set -euo pipefail
        "${CROSSREV_BIN:?}" doctor

    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.app-token }}
      run: |
        set -euo pipefail
        [[ -n "${{ inputs.app-token }}" ]] || {
          echo "::error::app-token is empty. crossrev will not run with GITHUB_TOKEN:" \
               "writes made with it do not trigger workflows, so the loop would stop" \
               "after one pass with no error anywhere."
          exit 1
        }
        args=("${{ inputs.leg }}")
        [[ -n "${{ inputs.pr }}" ]] && args+=(--pr "${{ inputs.pr }}")
        [[ -n "${{ inputs.harness }}" ]] && args+=(--harness "${{ inputs.harness }}")
        [[ -n "${{ inputs.trigger }}" ]] && args+=(--trigger "${{ inputs.trigger }}")
        [[ "${{ inputs.no-tips }}" == "true" ]] && args+=(--no-tips)
        "${CROSSREV_BIN:?}" "${args[@]}"
