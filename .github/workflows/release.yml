name: release

# Builds the two native binaries, publishes them with plain checksums, and
# creates the GitHub Release when a version tag is pushed.
#
# The first native release ships two targets and nothing else
# (docs/adrs/0020-the-first-native-release-ships-a-reduced-scope.md):
# darwin/arm64 built on the pinned macOS runner, linux/amd64 built in the
# pinned Go container. Runner labels and image versions are recorded in
# scripts/release-targets.json; the workflow repeats the labels beside their
# consumer so a reader never has to open two files to know what ran where.
#
# npm is paused, not dropped. crossrev-ai is published and its versions are
# permanent, and a native binary cannot ship through the current
# single-package layout, so the publish job below skips until the platform
# packages exist. The checksum file is unsigned for the same reason: there is
# no installed base to defend yet, and signing lands beside this rather than
# rewriting it.
#
# Authentication for the npm job, when it runs again, is trusted publishing,
# and nothing else. GitHub mints a short-lived OIDC credential that npm
# verifies against a publisher configured on the package. There is no npm
# token in this repository and none on anybody's laptop, which is the point:
# a stored publish credential is the thing worth not having. CopyDesk
# publishes the same way.
#
# Configure the publisher once, against this file:
#
#   npm trust github crossrev-ai --file release.yml \
#     --repo carlosboeing/crossrev --allow-publish
#
# The filename is part of that record, case-sensitive and including the
# extension, so renaming this file breaks publishing until the publisher is
# revoked and recreated. `release.yml` is the name that survives adding a
# second distribution channel; `npm-publish.yml`, which this replaces, would
# have had to be renamed the day a Homebrew job arrived.
#
# No `environment:` on the publish job. npm matches the environment as an OIDC
# claim, so a block here must be mirrored by --env there or the exchange fails.

on:
  push:
    # Three components, so the floating `v0` tag never fires a publish. The
    # previous `v*` pattern matched it, and a `v0` move would have started a
    # run that failed its own version check.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release is coherent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          check-latest: false

      - name: Install and verify dependencies
        run: |
          set -euo pipefail
          command -v jq         >/dev/null || sudo apt-get install -y --no-install-recommends jq
          command -v yq         >/dev/null || sudo snap install yq
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck

          # Assert rather than assume. A missing shellcheck reads as clean.
          for t in bash git jq yq shellcheck openssl; do
            command -v "$t" >/dev/null || { echo "::error::$t is missing"; exit 1; }
          done

      - name: Lint
        run: bash scripts/lint.sh

      - name: The suite must pass on the exact commit being released
        run: bash tests/run.sh

      - name: VERSION, package.json and the tag must agree
        id: version
        run: |
          set -euo pipefail
          file_version="$(cat VERSION)"
          json_version="$(jq -r .version package.json)"
          # The version the release ships is the binary's, so the agreement
          # check builds it rather than running a script from the checkout.
          bash scripts/build-native.sh dist/crossrev-release-check
          cli_version="$(./dist/crossrev-release-check version)"

          echo "VERSION      $file_version"
          echo "package.json $json_version"
          echo "version      $cli_version"

          if [ "$file_version" != "$json_version" ] || [ "$file_version" != "$cli_version" ]; then
            echo "::error::VERSION, package.json and the built binary disagree"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "tag          $tag_version"
            if [ "$tag_version" != "$file_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version $file_version"
              exit 1
            fi
          fi

          echo "version=$file_version" >> "$GITHUB_OUTPUT"

      - name: The tarball must carry the shipped surface and nothing else
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          # The script reaches node on stdin through a quoted heredoc rather
          # than inside `node -e '...'`. Nothing between the delimiters is
          # parsed by the shell, so an apostrophe in a comment cannot close
          # the string. One did exactly that in CopyDesk and killed a release
          # with a syntax error before anything reached npm.
          node <<'NODE'
            const [pack] = require("./pack.json");
            const files = pack.files.map(f => f.path).sort();
            console.log(files.join("\n"));

            const required = [
              "LICENSE", "README.md", "VERSION", "package.json",
              "action.yml", "install.sh", "bootstrap.sh",
            ];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) {
              console.error("::error::missing from the tarball: " + missing.join(", "));
              process.exit(1);
            }

            // An allowlist, not a blocklist. Every packed path must fall under
            // package.json `files`, or be one npm always includes. A blocklist
            // only catches the leaks somebody thought of; this catches any path
            // that appears because `files` was widened.
            const allowed = require("./package.json").files;
            const always = ["LICENSE", "README.md", "package.json"];
            const stray = files.filter(f =>
              !always.includes(f) &&
              !allowed.some(a => a.endsWith("/") ? f.startsWith(a) : f === a));
            if (stray.length) {
              console.error("::error::not covered by package.json files: " + stray.join(", "));
              process.exit(1);
            }

            const kb = pack.size / 1024;
            console.log(`tarball ${kb.toFixed(1)} kB across ${files.length} files`);
            // No size budget: the tarball is the changelog gate's view of what
            // ships rather than a published artifact, and npm is paused until
            // the platform packages exist. The budget that used to sit here
            // capped the published single-package tarball; the binaries the
            // release actually publishes are tens of megabytes by nature.
          NODE

  build-darwin-arm64:
    name: Build darwin/arm64
    needs: verify
    # Pinned, never *-latest; scripts/release-targets.json records the image this resolves to.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          check-latest: false

      - name: Build
        env:
          GOTOOLCHAIN: go1.27.0
        run: |
          set -euo pipefail
          mkdir -p dist
          # CGO stays on: a CGO darwin/arm64 build leaves the linker's ad-hoc
          # signature on the Mach-O binary, which the next step asserts
          # (docs/adrs/0018-go-native-parity-contract.md). No explicit signing
          # step: the target that needed one is deferred.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/crossrev-darwin-arm64 ./cmd/crossrev

      - name: Assert the linker's ad-hoc signature
        run: |
          set -euo pipefail
          codesign -dv dist/crossrev-darwin-arm64 2>&1 | tee /tmp/codesign.txt
          grep -q 'Signature=adhoc' /tmp/codesign.txt

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crossrev-darwin-arm64
          path: dist/crossrev-darwin-arm64
          if-no-files-found: error

  build-linux-amd64:
    name: Build linux/amd64
    needs: verify
    # Pinned, never *-latest; scripts/release-targets.json records the image this resolves to.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Committed as image@sha256, never a mutable tag; scripts/release-targets.json records the digest.
    container:
      image: golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        # A containerized step defaults to `sh`, not bash, and this image's `sh`
        # is dash, which refuses `set -o pipefail`.
        shell: bash
        env:
          GOTOOLCHAIN: go1.27.0
        run: |
          set -euo pipefail
          mkdir -p dist
          # Static: the binary installs onto machines whose libc is unknown,
          # so it carries none.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/crossrev-linux-amd64 ./cmd/crossrev
          ./dist/crossrev-linux-amd64 --version

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crossrev-linux-amd64
          path: dist/crossrev-linux-amd64
          if-no-files-found: error

  release:
    name: Publish the binaries and create the GitHub Release
    needs: [verify, build-darwin-arm64, build-linux-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' || inputs.dry_run == false
    permissions:
      contents: write   # to create the GitHub Release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download both binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums.txt
        run: |
          set -euo pipefail
          # Plain SHA-256, unsigned: checksum signing is deferred with the rest
          # of supply-chain verification (docs/adrs/0020-the-first-native-release-ships-a-reduced-scope.md).
          (cd dist && sha256sum crossrev-darwin-arm64 crossrev-linux-amd64 > checksums.txt)
          cat dist/checksums.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          # Lift this version's section out of the changelog for the release body.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "See CHANGELOG.md." > body.md
          fi
          gh release create "v$version" --title "v$version" --notes-file body.md --verify-tag \
            dist/crossrev-darwin-arm64 dist/crossrev-linux-amd64 dist/checksums.txt

  publish:
    name: Publish to npm
    needs: verify
    # Paused until the npm platform packages exist (docs/adrs/0020-the-first-native-release-ships-a-reduced-scope.md).
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to create the GitHub Release
      id-token: write   # to mint the OIDC credential for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false   # never cache in a release build

      - name: Trusted publishing needs npm 11.5.1 or later
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish
        # No NODE_AUTH_TOKEN. With no secret it resolves to an empty string,
        # and setup-node still writes an .npmrc declaring _authToken=, which
        # reads as auth that is configured and wrong rather than absent.
        # OIDC is the only credential, which is the point of trusted publishing.
        run: npm publish --access public --provenance

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          # Lift this version's section out of the changelog for the release body.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "See CHANGELOG.md." > body.md
          fi
          gh release create "v$version" --title "v$version" --notes-file body.md --verify-tag

  smoke:
    name: Install from the registry and run it
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # A publish nobody installed is a publish nobody verified. This runs the
      # published artifact from a clean directory rather than the checkout.
      # Skipped while npm is paused: publish never runs, so there is nothing
      # on the registry to verify.
      - name: npx the published version
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            if npx --yes "crossrev-ai@$version" version; then break; fi
            echo "not on the registry yet, retrying in 15s"
            sleep 15
          done
          test "$(npx --yes "crossrev-ai@$version" version)" = "$version"
          # `--help` needs no credential, no network and no repository, so it
          # exercises the shipped entrypoint without standing up a fixture.
          npx --yes "crossrev-ai@$version" --help | grep -q "cross-model PR review loop"
          echo "published artifact verified"
