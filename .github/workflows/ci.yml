# The offline suite and the linter, on a runner.
#
# Every command here is one a contributor runs locally, unchanged. Nothing here
# needs a network, a model, a GitHub App or a pull request — the suite stubs its
# own `gh` and harnesses.
#
# The dependency step is explicit rather than trusted, for one specific reason:
# `scripts/lint.sh` SKIPS shellcheck with a note when it is not installed and
# still prints `lint clean`. A runner without shellcheck would therefore report a
# green lint that never linted anything. The check below fails instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.0'
          check-latest: false

      - name: Install and verify dependencies
        run: |
          set -euo pipefail
          # jq, yq and shellcheck are all preinstalled on ubuntu-latest today.
          # Installing anyway costs seconds and survives an image change.
          command -v jq         >/dev/null || sudo apt-get install -y --no-install-recommends jq
          command -v yq         >/dev/null || sudo snap install yq
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck

          # Assert rather than assume. A missing shellcheck reads as clean.
          for t in bash git jq yq shellcheck openssl go; do
            command -v "$t" >/dev/null || { echo "::error::$t is missing"; exit 1; }
          done
          printf '%s\n' "bash $BASH_VERSION" "$(jq --version)" "$(yq --version)" \
            "$(shellcheck --version | sed -n 's/^version: /shellcheck /p')" \
            "$(openssl version)" "$(go version)"

      - name: Lint
        run: bash scripts/lint.sh

      - name: Go tests
        env:
          GOTOOLCHAIN: go1.27.0
        run: go test ./...

      - name: Native tests
        run: bash scripts/test-native.sh

      - name: Tests
        run: bash tests/run.sh

  # A pull request only. The check compares against the base branch, and a push
  # has no base to compare against.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is load-bearing. The default shallow clone shares no
      # history with the base branch, so `git diff base...HEAD` dies with
      # "no merge base" rather than returning a diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        # checkout fetches only the ref it checks out, so the base still needs
        # naming even with full depth. The ref goes through the environment
        # rather than the command line, so a branch name is never read as shell.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Verify dependencies
        run: |
          set -euo pipefail
          for t in bash git jq npm; do
            command -v "$t" >/dev/null || { echo "::error::$t is missing"; exit 1; }
          done

      - name: Changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-changelog.sh "origin/$BASE_REF"

  required:
    name: required
    if: always()
    needs:
      - test
      - changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify status of required CI jobs
        run: |
          set -euo pipefail
          test_result="${{ needs.test.result }}"
          changelog_result="${{ needs.changelog.result }}"
          event_name="${{ github.event_name }}"

          echo "test job result:      $test_result"
          echo "changelog job result: $changelog_result (event: $event_name)"

          if [ "$test_result" != "success" ]; then
            echo "::error::mandatory job 'test' did not succeed (result: $test_result)"
            exit 1
          fi

          if [ "$event_name" = "pull_request" ]; then
            if [ "$changelog_result" != "success" ]; then
              echo "::error::mandatory job 'changelog' did not succeed on pull request (result: $changelog_result)"
              exit 1
            fi
          else
            if [ "$changelog_result" != "success" ] && [ "$changelog_result" != "skipped" ]; then
              echo "::error::job 'changelog' had unexpected status (result: $changelog_result)"
              exit 1
            fi
          fi

          echo "All required checks passed."
