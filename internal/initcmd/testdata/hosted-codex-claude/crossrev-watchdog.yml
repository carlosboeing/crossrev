# Generated by `crossrev init` — regenerate with `crossrev init --upgrade`.
#
# The watchdog exists because automated mode's failure mode is silence: a
# chaining bug looks identical to a converged pull request. Without this, a pass
# that never fired and a pass that converged are indistinguishable from outside.
name: crossrev watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later in this job runs git over the network, so the token
          # this fetched with is not persisted in the checkout.
          persist-credentials: false

      # A tag is not a pin: `git tag -f` plus a force push moves it. The 40
      # character SHA is the pin and the tag rides in the comment.
      - name: watchdog
        uses: carlosboeing/crossrev@0123456789abcdef0123456789abcdef01234567   # v9.9.9
        with:
          leg: watchdog
          app-token: ${{ steps.app.outputs.token }}
        env:
          CROSSREV_APP_SLUG: ${{ steps.app.outputs.app-slug }}
