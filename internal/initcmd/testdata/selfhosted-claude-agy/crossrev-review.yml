# Generated by `crossrev init` — regenerate with `crossrev init --upgrade`.
#
# Hand-editing this file works until the next upgrade rewrites it. Change
# .github/crossrev.yml instead; that is the file this one reads.
name: crossrev review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
  issue_comment:
    types: [created]

# One concurrency group per pull request, SHARED with the resolve workflow. That
# sharing is what stops two legs writing the pull request at once.
#
# `queue: max` is not optional. GitHub's default keeps one running plus ONE
# pending run per group, and a newly queued run cancels the pending one and takes
# its place — so omitting the key silently drops events. `queue: max` holds up to
# 100 pending runs and executes them in order. Combining it with
# cancel-in-progress: true is a validation error, and this design wants neither:
# cancelling is unsafe once the resolve leg has started pushing.
#
# Run ordering is documented as FIFO but explicitly not guaranteed, so
# correctness comes from the head_sha check and the trusted markers. The queue
# only reduces wasted work.
concurrency:
  group: crossrev-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  queue: max

jobs:
  review:
    # Fork pull requests are skipped rather than run unauthenticated: GitHub
    # withholds secrets from them. pull_request_target would supply the secrets
    # and is the one configuration that turns a fork PR into an exploit, so it
    # appears nowhere in this design.
    #
    # The fork check sits inside the pull_request branch rather than in front of
    # the whole condition. In front, it ANDed with the comment branch too — and
    # an issue_comment payload carries no github.event.pull_request at all, so
    # that read was null, the comparison was false, and the entire trigger could
    # never fire. The `on: issue_comment` block and the /crossrev review branch
    # were dead the whole time.
    #
    # A comment cannot be fork-checked here, because its payload says nothing
    # about the head repository. That check moved into the first step below,
    # which runs before anything is checked out.
    if: >-
      (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.draft == false
        && (
          github.event.action != 'labeled'
          || github.event.label.name == 'crossrev/awaiting-review'
        )
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '/crossrev review')
        && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: [self-hosted, crossrev]
    permissions:
      contents: read
    steps:
      # Every write goes through this token, never GITHUB_TOKEN. GitHub
      # deliberately does not fire workflows from events created with the default
      # token — it is the built-in loop guard, and it applies to label changes as
      # well as pushes. With the harness CLI called directly there is no managed
      # token to fall back on.
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          skip-token-revoke: true

      # Resolve the number, and make the fork check a comment cannot make in the
      # job condition above.
      #
      # This has to happen before the checkout below, not inside crossrev, and the
      # difference matters. An issue_comment runs in the BASE repository's
      # context and therefore WITH secrets, while the next step checks out
      # refs/pull/N/head — attacker-controlled code on a fork pull request. A
      # guard that fired only once crossrev was running would already have put
      # that code on disk beside a subscription token. That combination is
      # exactly what makes pull_request_target dangerous, and why it appears
      # nowhere in this design.
      - id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "number=$NUMBER" >>"$GITHUB_OUTPUT"
          fork="$(gh pr view "$NUMBER" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)"
          if [[ "$fork" == "true" ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::crossrev does not run on fork pull requests: GitHub withholds secrets from them, and the head branch is not this repository's to push to. Review it by hand."
          fi

      - if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          # The token checks the code out and is then forgotten: keeping it
          # would persist it in the checkout's git config for the rest of the
          # job. CrossRev authenticates its own git calls per invocation, so
          # later steps in this job have no persisted credential to reuse.
          persist-credentials: false


      # A tag is not a pin: `git tag -f` plus a force push moves it. The 40
      # character SHA is the pin and the tag rides in the comment.
      - name: review
        if: steps.pr.outputs.skip != 'true'
        uses: carlosboeing/crossrev@0123456789abcdef0123456789abcdef01234567   # untagged
        with:
          leg: review
          pr: ${{ steps.pr.outputs.number }}
          app-token: ${{ steps.app.outputs.token }}
          trigger: ${{ github.event_name == 'pull_request' && 'automatic' || 'human' }}
        env:
          CROSSREV_APP_SLUG: ${{ steps.app.outputs.app-slug }}

      # The run log — and the transcripts, which survive only a failed leg —
      # dies with the runner unless it leaves as an artifact. The pull request
      # marker stays the durable record; this is the diagnosis for a leg that
      # went wrong. No GitHub credential reaches these files: the harness never
      # holds one, and the transcripts are redacted before they are kept.
      - if: always() && steps.pr.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crossrev-run-${{ github.run_id }}
          path: ~/.local/state/crossrev/runs/
          if-no-files-found: ignore
          retention-days: 14

      # The token is revoked rather than left to expire, and this runs even when
      # the leg failed.
      - if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method DELETE installation/token || true

  notice:
    # A workflow token's permissions are set per job, so a comment posted
    # from the leg job would need that job to hold pull-requests write —
    # beside the App token it mints and the checkout the loop pushes from.
    # This job runs instead, only when the leg failed, carrying only what
    # commenting needs. `actions: read` lets it ask the run API which steps
    # failed; the two write scopes let it answer on the pull request.
    needs: [review]
    if: failure()
    runs-on: [self-hosted, crossrev]
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      # The workflow's own token, never the App token: the step that mints
      # the App token may be the step that failed, and a notice needing it
      # would go silent exactly when it is most needed.
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -z "$NUMBER" ]]; then
            echo "no pull request number in this event; nothing to notify."
            exit 0
          fi
          run_url="https://github.com/$REPO/actions/runs/$RUN_ID"

          # The steps that failed, read off this run. `gh` parses its own
          # response, so the runner needs no other tool. When the read
          # itself fails, the notice still posts — naming the run rather
          # than the steps.
          failed="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .steps[]? | select(.conclusion == "failure") | .name] | unique | .[]')" || failed=""

          steps_block=""
          # A backtick in a step name would close the code span the comment
          # wraps it in, so it reads as an apostrophe instead.
          apos="'"
          if [[ -n "$failed" ]]; then
            while IFS= read -r step; do
              [[ -n "$step" ]] || continue
              step="${step//\`/$apos}"
              case "$step" in
                *pp-token*|*"pp token"*|*"pp Token"*)
                  fix="the workflow could not mint its GitHub App token. Check that the APP_ID and APP_PRIVATE_KEY secrets are set on the repository and that the App is still installed on it." ;;
                *checkout*|*Checkout*)
                  fix="the checkout failed before CrossRev started. Re-run the job; if it persists, check the branch still exists." ;;
                *curl*)
                  fix="installing the harness failed before CrossRev started. Re-run the job; if it persists, check the install source answers." ;;
                *review*)
                  fix="the CrossRev review leg itself failed. Read the claim comment CrossRev posted on this pull request and the run log in the crossrev-run-$RUN_ID artifact." ;;
                *)
                  fix="check the run log at $run_url." ;;
              esac
              steps_block+="- \`$step\`: $fix"$'\n'
            done <<< "$failed"
          fi

          steps_block="${steps_block%$'\n'}"

          body="CrossRev: the review leg failed on this pull request."
          if [[ -n "$steps_block" ]]; then
            body+=$'\n\nThe failed steps, from [run '"$RUN_ID"']('"${run_url}"$'):\n\n'"${steps_block}"
          else
            body+=$'\n\nThe run API named no failed step; the run itself is at '"${run_url}"'.'
          fi
          body+=$'\n\nTo retry, remove and re-apply the `crossrev/awaiting-review` label, or comment `/crossrev review` on the pull request.'

          gh pr comment "$NUMBER" --repo "$REPO" --body "$body"
