# Generated by `crossrev init` — regenerate with `crossrev init --upgrade`.
name: crossrev resolve

on:
  pull_request:
    types: [labeled]

# The SAME group as the review workflow. Two legs must never write the pull
# request simultaneously, and one shared group is what prevents it. See the review
# workflow for why `queue: max` is required rather than optional.
concurrency:
  group: crossrev-pr-${{ github.event.pull_request.number }}
  queue: max

jobs:
  resolve:
    if: >-
      github.event.label.name == 'crossrev/awaiting-resolution'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: __RUNS_ON__
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          skip-token-revoke: true

      # The head branch by name, not by refs/pull/N/head: this leg pushes, and a
      # detached checkout of the merge ref has nothing to push to. crossrev's own
      # push guard asserts the branch matches the pull request's head and is not
      # the repository default before anything leaves the runner.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          # The token checks the code out and is then forgotten: keeping it
          # would persist it in the checkout's git config for the rest of the
          # job. CrossRev authenticates its own git calls per invocation, so
          # later steps in this job have no persisted credential to reuse.
          persist-credentials: false

      # crossrev:only github-hosted
      # The whole step sits inside the sentinel rather than just its body: a
      # `run:` block emptied by the filter is a workflow that fails to parse.
      - run: |
          __HARNESS_INSTALL__
      # crossrev:end

      # A tag is not a pin: `git tag -f` plus a force push moves it. The 40
      # character SHA is the pin and the tag rides in the comment.
      - name: resolve
        uses: carlosboeing/crossrev@__SOURCE_SHA__   # __SOURCE_REF__
        with:
          leg: resolve
          pr: ${{ github.event.pull_request.number }}
          app-token: ${{ steps.app.outputs.token }}
        env:
          CROSSREV_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          # crossrev:only github-hosted
          # Read-only, and discarded when the leg finishes. See the review
          # workflow: one writer, and it is the refresher.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CROSSREV_CODEX_AUTH: ${{ secrets.CROSSREV_CODEX_AUTH }}
          # crossrev:end

      # The run log — and the transcripts, which survive only a failed leg —
      # dies with the runner unless it leaves as an artifact. The pull request
      # marker stays the durable record; this is the diagnosis for a leg that
      # went wrong. No GitHub credential reaches these files: the harness never
      # holds one, and the transcripts are redacted before they are kept.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossrev-run-${{ github.run_id }}
          path: ~/.local/state/crossrev/runs/
          if-no-files-found: ignore
          retention-days: 14

      - if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method DELETE installation/token || true

  notice:
    # A workflow token's permissions are set per job, so a comment posted
    # from the leg job would need that job to hold pull-requests write —
    # beside the App token it mints and the checkout the loop pushes from.
    # This job runs instead, only when the leg failed, carrying only what
    # commenting needs. `actions: read` lets it ask the run API which steps
    # failed; the two write scopes let it answer on the pull request.
    needs: [resolve]
    if: failure()
    runs-on: __RUNS_ON__
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      # The workflow's own token, never the App token: the step that mints
      # the App token may be the step that failed, and a notice needing it
      # would go silent exactly when it is most needed.
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -z "$NUMBER" ]]; then
            echo "no pull request number in this event; nothing to notify."
            exit 0
          fi
          run_url="https://github.com/$REPO/actions/runs/$RUN_ID"

          # The steps that failed, read off this run. `gh` parses its own
          # response, so the runner needs no other tool. When the read
          # itself fails, the notice still posts — naming the run rather
          # than the steps.
          failed="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .steps[]? | select(.conclusion == "failure") | .name] | unique | .[]')" || failed=""

          steps_block=""
          # A backtick in a step name would close the code span the comment
          # wraps it in, so it reads as an apostrophe instead.
          apos="'"
          if [[ -n "$failed" ]]; then
            while IFS= read -r step; do
              [[ -n "$step" ]] || continue
              step="${step//\`/$apos}"
              case "$step" in
                *pp-token*|*"pp token"*|*"pp Token"*)
                  fix="the workflow could not mint its GitHub App token. Check that the APP_ID and APP_PRIVATE_KEY secrets are set on the repository and that the App is still installed on it." ;;
                *checkout*|*Checkout*)
                  fix="the checkout failed before CrossRev started. Re-run the job; if it persists, check the branch still exists." ;;
                *curl*)
                  fix="installing the harness failed before CrossRev started. Re-run the job; if it persists, check the install source answers." ;;
                *resolve*)
                  fix="the CrossRev resolve leg itself failed. Read the claim comment CrossRev posted on this pull request and the run log in the crossrev-run-$RUN_ID artifact." ;;
                *)
                  fix="check the run log at $run_url." ;;
              esac
              steps_block+="- \`$step\`: $fix"$'\n'
            done <<< "$failed"
          fi

          steps_block="${steps_block%$'\n'}"

          body="CrossRev: the resolve leg failed on this pull request."
          if [[ -n "$steps_block" ]]; then
            body+=$'\n\nThe failed steps, from [run '"$RUN_ID"']('"${run_url}"$'):\n\n'"${steps_block}"
          else
            body+=$'\n\nThe run API named no failed step; the run itself is at '"${run_url}"'.'
          fi
          body+=$'\n\nTo retry, remove and re-apply the `crossrev/awaiting-resolution` label.'

          gh pr comment "$NUMBER" --repo "$REPO" --body "$body"
